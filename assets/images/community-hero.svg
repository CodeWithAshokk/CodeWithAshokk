<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#commGrad)" />

  <!-- Network Interconnection Web -->
  <!-- Connecting lines -->
  <line x1="300" y1="200" x2="160" y2="110" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="300" y1="200" x2="440" y2="110" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="300" y1="200" x2="130" y2="280" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="300" y1="200" x2="470" y2="280" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="300" y1="200" x2="300" y2="340" stroke="url(#glowLine)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="160" y1="110" x2="440" y2="110" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="130" y1="280" x2="300" y2="340" stroke="#334155" stroke-width="1.5" opacity="0.4" />
  <line x1="470" y1="280" x2="300" y2="340" stroke="#334155" stroke-width="1.5" opacity="0.4" />

  <!-- Concentric Radar Circles around Center -->
  <circle cx="300" cy="200" r="70" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.4" />
  <circle cx="300" cy="200" r="120" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="8 8" fill="none" opacity="0.3" />

  <!-- Center Hub: Code With Ashok -->
  <circle cx="300" cy="200" r="48" fill="#0f172a" stroke="#00f2fe" stroke-width="3" />
  <text x="300" y="196" fill="#00f2fe" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">&lt;CWA/&gt;</text>
  <text x="300" y="214" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">HUB</text>

  <!-- Node 1: WhatsApp -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="0" y="4" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">WA</text>
    <rect x="-45" y="38" width="90" height="20" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="0" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Daily Chat</text>
  </g>

  <!-- Node 2: Telegram -->
  <g transform="translate(440, 110)">
    <circle cx="0" cy="0" r="32" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="2" />
    <text x="0" y="4" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">TG</text>
    <rect x="-50" y="38" width="100" height="20" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <text x="0" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Resources Hub</text>
  </g>

  <!-- Node 3: GitHub / Open Source -->
  <g transform="translate(130, 280)">
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
    <text x="0" y="4" fill="#c084fc" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">GIT</text>
    <rect x="-55" y="38" width="110" height="20" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <text x="0" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Code Reviews</text>
  </g>

  <!-- Node 4: Instagram -->
  <g transform="translate(470, 280)">
    <circle cx="0" cy="0" r="32" fill="#831843" stroke="#f43f5e" stroke-width="2" />
    <text x="0" y="4" fill="#fb7185" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">IG</text>
    <rect x="-45" y="38" width="90" height="20" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
    <text x="0" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Dev Tips</text>
  </g>

  <!-- Node 5: Mentorship -->
  <g transform="translate(300, 340)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#fbbf24" stroke-width="2" />
    <text x="0" y="4" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">1:1</text>
    <rect x="-50" y="34" width="100" height="18" rx="9" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="0" y="47" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">Peer Mentorship</text>
  </g>
</svg>