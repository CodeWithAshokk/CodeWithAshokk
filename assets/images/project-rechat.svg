<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rechatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#rechatBg)" />
  <!-- Titlebar -->
  <rect width="600" height="40" rx="16" fill="#0b1120" />
  <rect y="25" width="600" height="15" fill="#0b1120" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="59" cy="20" r="5" fill="#10b981" />
  <rect x="150" y="10" width="300" height="20" rx="6" fill="#1e293b" />
  <text x="210" y="24" fill="#38bdf8" font-family="monospace" font-size="11">Rechat • Realtime Messenger</text>

  <!-- Left Chat List Sidebar -->
  <rect x="20" y="55" width="170" height="285" rx="10" fill="#0e1626" stroke="#1e293b" />
  <text x="35" y="80" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">Conversations</text>
  
  <!-- Active Chat Item -->
  <rect x="28" y="95" width="154" height="46" rx="8" fill="#1e293b" stroke="#00e5ff" stroke-width="1.2" />
  <circle cx="48" cy="118" r="14" fill="#6366f1" />
  <text x="44" y="122" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">R</text>
  <circle cx="58" cy="128" r="4" fill="#10b981" />
  <text x="68" y="113" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Dev Group</text>
  <text x="68" y="128" fill="#94a3b8" font-family="sans-serif" font-size="9">typing...</text>

  <!-- Chat Item 2 -->
  <rect x="28" y="148" width="154" height="42" rx="6" fill="transparent" />
  <circle cx="48" cy="169" r="14" fill="#0284c7" />
  <text x="44" y="173" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">A</text>
  <text x="68" y="165" fill="#e2e8f0" font-family="sans-serif" font-size="11">Ashok (You)</text>
  <text x="68" y="180" fill="#64748b" font-family="sans-serif" font-size="9">Code review passed</text>

  <!-- Chat Item 3 -->
  <rect x="28" y="196" width="154" height="42" rx="6" fill="transparent" />
  <circle cx="48" cy="217" r="14" fill="#ec4899" />
  <text x="44" y="221" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">C</text>
  <text x="68" y="213" fill="#e2e8f0" font-family="sans-serif" font-size="11">Community Chat</text>
  <text x="68" y="228" fill="#64748b" font-family="sans-serif" font-size="9">14 unread messages</text>

  <!-- Main Active Chat Pane -->
  <rect x="200" y="55" width="380" height="285" rx="10" fill="#090d16" stroke="#1e293b" />
  
  <!-- Chat Header Bar -->
  <rect x="200" y="55" width="380" height="45" rx="10" fill="#111827" />
  <circle cx="225" cy="77" r="13" fill="#6366f1" />
  <text x="245" y="75" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Dev Group • 8 Online</text>
  <text x="245" y="89" fill="#10b981" font-family="sans-serif" font-size="9">⚡ WebSocket Connected (2ms)</text>

  <!-- Chat Bubble 1 (Incoming) -->
  <rect x="215" y="115" width="220" height="48" rx="8" fill="#1e293b" />
  <text x="228" y="133" fill="#e2e8f0" font-family="sans-serif" font-size="11">Hey Ashok! Rechat latency is</text>
  <text x="228" y="149" fill="#e2e8f0" font-family="sans-serif" font-size="11">under 5ms. Amazing UI!</text>

  <!-- Chat Bubble 2 (Outgoing) -->
  <rect x="335" y="175" width="230" height="48" rx="8" fill="url(#neonCyan)" />
  <text x="348" y="193" fill="#070b14" font-family="sans-serif" font-weight="600" font-size="11">Thanks! Built with pure vanilla</text>
  <text x="348" y="209" fill="#070b14" font-family="sans-serif" font-weight="600" font-size="11">JS &amp; WebSocket architecture 🚀</text>

  <!-- Input Bar at Bottom -->
  <rect x="212" y="288" width="300" height="38" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="226" y="312" fill="#64748b" font-family="sans-serif" font-size="11">Type your message...</text>
  <rect x="522" y="288" width="46" height="38" rx="8" fill="url(#neonCyan)" />
  <polygon points="540,302 540,314 552,308" fill="#070b14" />
</svg>