<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d9b8" />
      <stop offset="100%" stop-color="#e2af80" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Tech Grid / Halo -->
  <circle cx="200" cy="180" r="140" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="6 8" opacity="0.35" />
  <circle cx="200" cy="180" r="165" stroke="url(#accentPurple)" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.25" />

  <!-- Floating Code Matrix Particles -->
  <text x="45" y="70" fill="#00f2fe" opacity="0.4" font-family="monospace" font-size="14">&lt;dev&gt;</text>
  <text x="310" y="90" fill="#8b5cf6" opacity="0.4" font-family="monospace" font-size="14">&#123;code&#125;</text>
  <text x="320" y="320" fill="#00f2fe" opacity="0.3" font-family="monospace" font-size="14">async () =&gt;</text>
  <text x="40" y="330" fill="#ec4899" opacity="0.3" font-family="monospace" font-size="14">console.log</text>

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie Back Neck -->
  <path d="M140 270 Q200 300 260 270 L280 400 L120 400 Z" fill="#111827" />

  <!-- Body / Hoodie Shoulders -->
  <path d="M100 400 C110 320 145 285 200 285 C255 285 290 320 300 400 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2" />
  <!-- Hoodie Zipper / Accent Lines -->
  <line x1="200" y1="285" x2="200" y2="400" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
  <!-- Neon Drawstrings -->
  <path d="M185 285 Q180 340 175 355" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M215 285 Q220 340 225 355" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="8" fill="url(#skinGrad)" />
  <path d="M182 245 Q200 260 218 245 Z" fill="#d49a6a" opacity="0.6" />

  <!-- Head Base Shape -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Ears -->
  <ellipse cx="143" cy="182" rx="10" ry="16" fill="url(#skinGrad)" />
  <ellipse cx="257" cy="182" rx="10" ry="16" fill="url(#skinGrad)" />

  <!-- Modern Hair Style -->
  <path d="M142 165 C138 120 170 95 200 95 C235 95 262 120 258 165 C250 140 240 125 200 125 C160 125 150 145 142 165 Z" fill="#1e1b29" />
  <path d="M144 140 C155 105 190 92 230 100 C250 105 258 125 256 142 C240 120 220 115 190 118 C165 120 152 130 144 140 Z" fill="#2d2a3e" />
  <!-- Stylish hair swoop / highlights -->
  <path d="M170 98 Q205 92 235 110 Q210 105 185 105 Z" fill="#00f2fe" opacity="0.6" />

  <!-- Modern Sleek Developer Glasses -->
  <rect x="156" y="162" width="36" height="24" rx="6" fill="#0f172a" fill-opacity="0.3" stroke="#00f2fe" stroke-width="2.5" />
  <rect x="208" y="162" width="36" height="24" rx="6" fill="#0f172a" fill-opacity="0.3" stroke="#00f2fe" stroke-width="2.5" />
  <line x1="192" y1="172" x2="208" y2="172" stroke="#00f2fe" stroke-width="2.5" />
  <!-- Glass arms -->
  <line x1="144" y1="168" x2="156" y2="172" stroke="#00f2fe" stroke-width="2" />
  <line x1="244" y1="172" x2="256" y2="168" stroke="#00f2fe" stroke-width="2" />
  <!-- Subtle Glasses Lens Reflection -->
  <line x1="162" y1="166" x2="178" y2="182" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <line x1="214" y1="166" x2="230" y2="182" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="174" r="4.5" fill="#1e293b" />
  <circle cx="226" cy="174" r="4.5" fill="#1e293b" />
  <circle cx="176" cy="172" r="1.5" fill="#ffffff" />
  <circle cx="228" cy="172" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M158 153 Q174 148 188 153" stroke="#1e1b29" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M212 153 Q226 148 242 153" stroke="#1e1b29" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M200 178 L197 195 L204 196" stroke="#c98a58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Friendly Developer Smile -->
  <path d="M188 212 Q200 222 212 212" stroke="#b06d3b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Glowing Headset / Audio detail -->
  <path d="M140 175 Q135 150 150 130" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
  <rect x="134" y="170" width="8" height="24" rx="4" fill="#8b5cf6" opacity="0.9" />

  <!-- Bottom Floating Badge "CODE WITH ASHOK" -->
  <g transform="translate(90, 345)">
    <rect width="220" height="38" rx="19" fill="#090d16" fill-opacity="0.85" stroke="url(#neonCyan)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10b981" filter="url(#softGlow)" />
    <text x="35" y="24" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" letter-spacing="0.5">ASHOK • FULL STACK</text>
  </g>
</svg>