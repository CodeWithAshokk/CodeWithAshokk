<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#qrGrad)" />
  <!-- Window Header -->
  <rect width="600" height="40" rx="16" fill="#042f2e" />
  <rect y="25" width="600" height="15" fill="#042f2e" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="59" cy="20" r="5" fill="#10b981" />
  <rect x="150" y="10" width="300" height="20" rx="6" fill="#134e4a" />
  <text x="215" y="24" fill="#5eead4" font-family="monospace" font-size="11">QR Code Studio • Pro Generator</text>

  <!-- Left: Controls & Customization Panel -->
  <rect x="25" y="55" width="280" height="285" rx="12" fill="#0f172a" stroke="#134e4a" />
  <text x="40" y="80" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="13">QR Configuration</text>

  <text x="40" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10">Target URL / Text Data</text>
  <rect x="40" y="115" width="250" height="32" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="50" y="135" fill="#e2e8f0" font-family="monospace" font-size="11">https://codewithashok.dev</text>

  <text x="40" y="168" fill="#94a3b8" font-family="sans-serif" font-size="10">Color Palettes &amp; Gradients</text>
  <g transform="translate(40, 178)">
    <circle cx="12" cy="12" r="12" fill="#00e5ff" stroke="#ffffff" stroke-width="2" />
    <circle cx="44" cy="12" r="12" fill="#10b981" />
    <circle cx="76" cy="12" r="12" fill="#8b5cf6" />
    <circle cx="108" cy="12" r="12" fill="#f59e0b" />
    <circle cx="140" cy="12" r="12" fill="#ec4899" />
  </g>

  <text x="40" y="222" fill="#94a3b8" font-family="sans-serif" font-size="10">Error Correction Level: High (30%)</text>
  <rect x="40" y="232" width="250" height="6" rx="3" fill="#1e293b" />
  <rect x="40" y="232" width="180" height="6" rx="3" fill="#10b981" />

  <!-- Action Buttons -->
  <rect x="40" y="255" width="120" height="34" rx="6" fill="url(#emeraldGrad)" />
  <text x="52" y="276" fill="#090d16" font-family="sans-serif" font-weight="bold" font-size="11">Download PNG</text>

  <rect x="170" y="255" width="120" height="34" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="185" y="276" fill="#e2e8f0" font-family="sans-serif" font-weight="500" font-size="11">Export SVG</text>

  <text x="40" y="318" fill="#34d399" font-family="monospace" font-size="9">✓ 100% Client-Side Render (Zero Lag)</text>

  <!-- Right: Generated Stylized QR Code Preview -->
  <rect x="325" y="55" width="250" height="285" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
  
  <!-- Stylized QR Code Graphic -->
  <rect x="350" y="75" width="200" height="200" rx="12" fill="#ffffff" />
  
  <!-- Outer Finder Pattern 1 (Top Left) -->
  <rect x="362" y="87" width="50" height="50" rx="8" fill="#0f172a" />
  <rect x="372" y="97" width="30" height="30" rx="4" fill="#ffffff" />
  <rect x="380" y="105" width="14" height="14" rx="3" fill="#00e5ff" />

  <!-- Outer Finder Pattern 2 (Top Right) -->
  <rect x="488" y="87" width="50" height="50" rx="8" fill="#0f172a" />
  <rect x="498" y="97" width="30" height="30" rx="4" fill="#ffffff" />
  <rect x="506" y="105" width="14" height="14" rx="3" fill="#00e5ff" />

  <!-- Outer Finder Pattern 3 (Bottom Left) -->
  <rect x="362" y="213" width="50" height="50" rx="8" fill="#0f172a" />
  <rect x="372" y="223" width="30" height="30" rx="4" fill="#ffffff" />
  <rect x="380" y="231" width="14" height="14" rx="3" fill="#00e5ff" />

  <!-- Simulated QR Data Dots -->
  <rect x="424" y="90" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="436" y="90" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="456" y="90" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="470" y="90" width="8" height="8" rx="2" fill="#0f172a" />

  <rect x="424" y="105" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="444" y="105" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="466" y="105" width="8" height="8" rx="2" fill="#0f172a" />

  <rect x="420" y="125" width="12" height="12" rx="3" fill="#0f172a" />
  <rect x="438" y="125" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="454" y="125" width="14" height="14" rx="3" fill="#0f172a" />

  <!-- Center Logo Badge -->
  <circle cx="450" cy="175" r="22" fill="#0f172a" stroke="#00e5ff" stroke-width="2" />
  <text x="450" y="180" fill="#00e5ff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">&lt;A/&gt;</text>

  <!-- Lower Data Dots -->
  <rect x="424" y="210" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="440" y="210" width="12" height="12" rx="3" fill="#0f172a" />
  <rect x="460" y="210" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="480" y="210" width="14" height="14" rx="3" fill="#0f172a" />
  <rect x="500" y="210" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="520" y="210" width="8" height="8" rx="2" fill="#0f172a" />

  <rect x="424" y="235" width="12" height="12" rx="3" fill="#0f172a" />
  <rect x="444" y="235" width="8" height="8" rx="2" fill="#0f172a" />
  <rect x="460" y="235" width="14" height="14" rx="3" fill="#0f172a" />
  <rect x="485" y="235" width="10" height="10" rx="3" fill="#0f172a" />
  <rect x="515" y="235" width="12" height="12" rx="3" fill="#0f172a" />

  <text x="365" y="305" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="11">Scan with any Mobile Camera</text>
  <text x="365" y="322" fill="#94a3b8" font-family="sans-serif" font-size="9">PNG / SVG / High Resolution 300 DPI</text>
</svg>