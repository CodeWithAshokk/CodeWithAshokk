<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#skyGrad)" />
  <!-- Titlebar -->
  <rect width="600" height="40" rx="16" fill="#082f49" />
  <rect y="25" width="600" height="15" fill="#082f49" />
  <circle cx="25" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="59" cy="20" r="5" fill="#10b981" />
  <text x="80" y="24" fill="#7dd3fc" font-family="sans-serif" font-weight="bold" font-size="12">WeatherCast Realtime Doppler &amp; Forecast</text>

  <!-- Weather cards -->
  <g transform="translate(30, 55)">
    <!-- Current weather primary tile -->
    <rect x="0" y="0" width="240" height="280" rx="12" fill="#0369a1" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" />
    <text x="25" y="40" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">New Delhi, IN</text>
    <text x="25" y="60" fill="#bae6fd" font-family="sans-serif" font-size="12">Partly Cloudy • Humidity 42%</text>

    <!-- Sun / Cloud SVG glyph -->
    <circle cx="120" cy="120" r="30" fill="#f59e0b" />
    <path d="M90 145 C90 135 100 125 115 125 C125 110 145 110 155 125 C165 125 175 135 175 145 Z" fill="#e0f2fe" opacity="0.9" />

    <text x="75" y="195" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="38">28°C</text>
    <text x="165" y="180" fill="#7dd3fc" font-family="sans-serif" font-size="14">/ 19°C</text>

    <rect x="20" y="215" width="95" height="50" rx="8" fill="#0284c7" />
    <text x="30" y="235" fill="#e0f2fe" font-family="sans-serif" font-size="11">Wind Speed</text>
    <text x="30" y="252" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">14 km/h</text>

    <rect x="125" y="215" width="95" height="50" rx="8" fill="#0284c7" />
    <text x="135" y="235" fill="#e0f2fe" font-family="sans-serif" font-size="11">Air Quality</text>
    <text x="135" y="252" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="14">Good (48)</text>

    <!-- 5-Day Forecast -->
    <rect x="260" y="0" width="280" height="280" rx="12" fill="#082f49" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" />
    <text x="280" y="35" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">5-Day Hourly Trend</text>

    <!-- Forecast Rows -->
    <g transform="translate(280, 55)">
      <text x="0" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="12">Mon</text>
      <text x="60" y="25" fill="#fbbf24" font-family="sans-serif" font-size="12">☀️ Sunny</text>
      <rect x="150" y="18" width="60" height="6" rx="3" fill="#38bdf8" />
      <text x="225" y="25" fill="#ffffff" font-family="monospace" font-size="12">31° / 20°</text>

      <text x="0" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">Tue</text>
      <text x="60" y="65" fill="#38bdf8" font-family="sans-serif" font-size="12">⛅ Breeze</text>
      <rect x="150" y="58" width="50" height="6" rx="3" fill="#38bdf8" />
      <text x="225" y="65" fill="#ffffff" font-family="monospace" font-size="12">29° / 18°</text>

      <text x="0" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="12">Wed</text>
      <text x="60" y="105" fill="#60a5fa" font-family="sans-serif" font-size="12">🌧️ Rain</text>
      <rect x="150" y="98" width="35" height="6" rx="3" fill="#38bdf8" />
      <text x="225" y="105" fill="#ffffff" font-family="monospace" font-size="12">24° / 17°</text>

      <text x="0" y="145" fill="#e2e8f0" font-family="sans-serif" font-size="12">Thu</text>
      <text x="60" y="145" fill="#fbbf24" font-family="sans-serif" font-size="12">⛅ Clear</text>
      <rect x="150" y="138" width="55" height="6" rx="3" fill="#38bdf8" />
      <text x="225" y="145" fill="#ffffff" font-family="monospace" font-size="12">28° / 19°</text>

      <text x="0" y="185" fill="#e2e8f0" font-family="sans-serif" font-size="12">Fri</text>
      <text x="60" y="185" fill="#fbbf24" font-family="sans-serif" font-size="12">☀️ Sunny</text>
      <rect x="150" y="178" width="65" height="6" rx="3" fill="#38bdf8" />
      <text x="225" y="185" fill="#ffffff" font-family="monospace" font-size="12">32° / 21°</text>
    </g>
  </g>
</svg>